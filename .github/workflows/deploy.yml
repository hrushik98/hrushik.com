name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: gemini-api-keys-489210
  REGION: asia-southeast1
  SERVICE: hrushik-com
  IMAGE: asia-southeast1-docker.pkg.dev/gemini-api-keys-489210/sites/hrushik-com
  WORKLOAD_IDENTITY_PROVIDER: projects/117511717915/locations/global/workloadIdentityPools/github/providers/hrushik-com
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@gemini-api-keys-489210.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$GITHUB_SHA" \
            --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 --min-instances 0 --max-instances 5 \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w "GET $URL -> %{http_code}\n" "$URL/"
